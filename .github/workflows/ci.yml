name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: E2E (macOS)
        if: runner.os == 'macOS'
        run: pnpm --filter @hangar/desktop test:e2e
      - name: Package (unsigned)
        run: pnpm --filter @hangar/desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: hangar-${{ runner.os }}
          path: |
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.zip
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.AppImage
          if-no-files-found: error

  # The bridge over real ssh against the dev server in Docker (ADR 0020).
  ssh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ssh
      - name: Server log
        if: failure()
        run: docker compose -f docker/dev-server/compose.yaml logs
        env:
          HANGAR_DEV_KEY: unused

  # The production image of hangar-server: health, session, job, restart (ADR 0029).
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:container

  # The Linux packages of hangar-server that the app ships (ADR 0041): both architectures
  # (arm64 through QEMU), the x64 one checked in a plain Debian without Node.
  linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:linux-server
      - run: pnpm test:linux-server
        env:
          HANGAR_LINUX_ARCH: x64
      # The app's setup over real ssh against a machine with systemd (ADR 0041, step 2).
      - run: pnpm test:linux-setup
      - uses: actions/upload-artifact@v4
        with:
          name: linux-server
          path: dist/linux-server/*.tar.gz
          if-no-files-found: error
