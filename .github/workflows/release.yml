name: Release

# Tag v1.2.3 publishes a stable release, v1.2.3-beta.1 a prerelease (beta channel).
# Each platform uploads into a draft; the release goes public only after all of them
# succeeded, so the updater never sees a release with missing files.
# Run by hand (workflow_dispatch) it is a dry run: same tests and packages on all three
# systems, uploaded as workflow artifacts; nothing goes to GitHub Releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The Linux packages of hangar-server go into every app (ADR 0041).
  linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:linux-server
      - run: pnpm test:linux-server
        env:
          HANGAR_LINUX_ARCH: x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-server
          path: dist/linux-server/*.tar.gz
          if-no-files-found: error

  release:
    needs: linux-server
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # mitmproxy for the proxy bay's engine test (ADR 0049), as in ci.yml.
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install mitmproxy==12.3.1
      - run: pnpm test
      - run: pnpm build
      - uses: actions/download-artifact@v4
        with:
          name: linux-server
          path: dist/linux-server
      - name: Prepare notarization key (macOS, if configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$KEY" ]; then
            echo "$KEY" > "$RUNNER_TEMP/apple_api_key.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"
          fi
      - name: Package and publish to GitHub Releases
        shell: bash
        # A missing secret arrives as "", which electron-builder takes for a path (CSC_LINK
        # "" resolves to the working directory: "… not a file"); unset, it builds unsigned.
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || unset "$name"
          done
          pnpm --filter @hangar/desktop exec electron-builder --publish "$PUBLISH"
        env:
          PUBLISH: ${{ github.event_name == 'push' && 'always' || 'never' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing: without these secrets the packages stay unsigned.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_P12_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          # macOS notarization (App Store Connect API key; APPLE_API_KEY is set above).
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # A broken signature makes macOS call the downloaded app "damaged" (adhoc-sign.mjs).
      - name: Check the app signature (macOS)
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict apps/desktop/release/*/mac*/Hangar.app
      - name: Keep the packages (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: |
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.zip
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.AppImage
            apps/desktop/release/*/*.yml
          if-no-files-found: error

  publish:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft (prerelease for beta tags)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then pre=true; else pre=false; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$pre"
