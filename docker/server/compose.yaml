# Example: hangar-server as a service in Docker on a Linux server (ADR 0029, docs/server-operations.md).
# Image: `pnpm image:server` in the repository. Then `docker compose up -d`.
name: hangar
services:
  server:
    image: hangar-server
    restart: always
    # The server listens on 127.0.0.1:7420 of the host; the desktop reaches it through ssh.
    # Without host networking that address would be the container's own loopback.
    network_mode: host
    # API keys of the agents and git identity (see server.env.example); never in the image.
    env_file: server.env
    volumes:
      - data:/data
      - projects:/projects
      # Deploy keys and their ssh config, owned by uid 1000 (user node in the image).
      - ./ssh:/home/node/.ssh:ro
volumes:
  data:
  projects:
